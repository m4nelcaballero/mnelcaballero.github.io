<!DOCTYPE html>
<html lang="es">

<head>

    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">


    <style>

        /* =====================================================
           CONFIGURACIÓN GENERAL
           ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Archivo", sans-serif;
            background: white;
            color: black;
            font-weight: 400;
        }


        /* =====================================================
           MENÚ
           ===================================================== */

        nav {
            position: fixed;
            top: 30px;
            left: 30px;
            width: 170px;
            text-align: center;
            z-index: 1000;
        }

        nav a {
            display: block;
            color: black;
            text-decoration: none;
            font-family: "Archivo", sans-serif;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            cursor: pointer;
        }

        nav a:hover {
            text-decoration: underline;
        }


        /* =====================================================
           CONTENIDO
           ===================================================== */

        main {
            padding: 80px 20px 40px 230px;
            max-width: 1100px;
            margin: 0 auto;
        }


        /* =====================================================
           SECCIONES
           ===================================================== */

        .seccion {
            display: none;
        }

        .seccion.activa {
            display: block;
        }


        /* =====================================================
           DESCRIPCIÓN
           ===================================================== */

        #descripcion p {
            font-family: "Archivo", sans-serif;
            font-size: 16px;
            line-height: 1.5;
            max-width: 700px;
            font-weight: 400;
        }


        /* =====================================================
           GALERÍAS
           ===================================================== */

        .galeria {
            width: 100%;
            text-align: center;
        }

        .galeria img {
            display: block;
            width: auto;
            max-width: 650px;
            max-height: 80vh;
            height: auto;
            margin: 0 auto 15px auto;
        }


        /* =====================================================
           JARDÍN
           ===================================================== */

        .jardin-contenedor {
            width: 100%;
        }


        /*
           CUADRÍCULA INVISIBLE 10 × 10

           La cuadrícula existe para ordenar las plantas,
           pero no tiene líneas ni bordes visibles.
        */

        .jardin {
            width: min(700px, 100%);
            aspect-ratio: 1 / 1;

            display: grid;

            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);

            margin: 0 auto;
        }


        /* CADA POSICIÓN */

        .casilla-planta {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }


        /* IMÁGENES */

        .casilla-planta img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;

            cursor: pointer;

            transition: opacity 0.2s ease,
                        transform 0.2s ease;
        }


        /* EFECTO AL PASAR EL CURSOR */

        .casilla-planta img:hover {
            opacity: 0.75;
            transform: scale(0.96);
        }


        /* =====================================================
           NOMBRE DE LA PLANTA
           ===================================================== */

        .nombre-planta {
            height: 25px;

            margin-top: 18px;

            text-align: center;

            font-family: "Archivo", sans-serif;
            font-size: 16px;
            font-weight: 400;

            opacity: 0;

            transition: opacity 0.2s ease;
        }

        .nombre-planta.visible {
            opacity: 1;
        }


        /* =====================================================
           MÓVIL
           ===================================================== */

        @media (max-width: 600px) {

            nav {
                top: 20px;
                left: 15px;
                width: 140px;
            }

            nav a {
                font-size: 15px;
                margin-bottom: 6px;
            }

            main {
                padding: 120px 15px 30px 15px;
            }

            .galeria img {
                max-width: 100%;
                max-height: none;
                margin-bottom: 10px;
            }

            .jardin {
                width: 100%;
            }

            .nombre-planta {
                font-size: 14px;
                margin-top: 15px;
            }

        }

    </style>

</head>


<body>

    <!-- =====================================================

    <script>


        /* =================================================
           CAMBIAR DE SECCIÓN
           ================================================= */

        function mostrarSeccion(seccion) {

            const secciones = document.querySelectorAll(".seccion");

            secciones.forEach(function(elemento) {
                elemento.classList.remove("activa");
            });

            document.getElementById(seccion).classList.add("activa");

            window.scrollTo(0, 0);

        }



        /* =================================================
           PLANTAS DEL JARDÍN
           =================================================

           Aquí es donde puedes modificar tu jardín.

           Cada planta tiene:

           imagen  = nombre del archivo
           nombre  = nombre que aparecerá abajo
           fila    = posición vertical, del 1 al 10
           columna = posición horizontal, del 1 al 10

           Ejemplo:

           {
               imagen: "planta1.jpg",
               nombre: "Romero",
               fila: 3,
               columna: 5
           }

        ================================================= */


        const plantas = [

            {
                imagen: "planta1.jpg",
                nombre: "Nombre de la planta 1",
                fila: 2,
                columna: 2
            },

            {

                fila: 3,
                columna: 7
            },

            {

                fila: 4,
                columna: 7
            },

            {

                nombre: "Nombre de la planta 6",
                fila: 4,
                columna: 8
            },

            {

                nombre: "Nombre de la planta 7",
                fila: 5,
                columna: 2
            },

            {
                imagen: "planta8.jpg",
                nombre: "Nombre de la planta 8",
                fila: 5,
                columna: 3
            },

            {
                imagen: "planta9.jpg",
                nombre: "Nombre de la planta 9",
                fila: 5,
                columna: 4
            },

            {
                imagen: "planta10.jpg",
                nombre: "Nombre de la planta 10",
                fila: 5,
                columna: 8
            },

            {
                imagen: "planta11.jpg",
                nombre: "Nombre de la planta 11",
                fila: 6,
                columna: 8
            },

            {
                imagen: "planta12.jpg",
                nombre: "Nombre de la planta 12",
                fila: 6,
                columna: 9
            },

            {
                imagen: "planta13.jpg",
                nombre: "Nombre de la planta 13",
                fila: 7,
                columna: 2
            },

            {
                imagen: "planta14.jpg",

                fila: 7,

            },

            {

            },

                nombre: "Nombre de la planta 28",
                fila: 10,
                columna: 9
            }

        ];



        /* =================================================
           CREAR EL JARDÍN
           ================================================= */

        const jardin = document.getElementById("jardin");

        const nombrePlanta = document.getElementById("nombrePlanta");


        /*
           Creamos las 100 posiciones.

           Las que no tengan ninguna planta
           permanecerán completamente vacías.
        */

        for (let fila = 1; fila <= 10; fila++) {

            for (let columna = 1; columna <= 10; columna++) {


                const casilla = document.createElement("div");

                casilla.classList.add("casilla-planta");


                /*
                   Buscamos si existe una planta
                   en esta posición.
                */

                const planta = plantas.find(function(item) {

                    return item.fila === fila &&
                           item.columna === columna;

                });


                /*
                   Si existe una planta,
                   colocamos su imagen.
                */

                if (planta) {

                    const imagen = document.createElement("img");

                    imagen.src = planta.imagen;

                    imagen.alt = planta.nombre;

                    imagen.dataset.nombre = planta.nombre;


                    /* PASAR EL CURSOR */

                    imagen.addEventListener("mouseenter", function() {

                        nombrePlanta.textContent =
                            imagen.dataset.nombre;

                        nombrePlanta.classList.add("visible");

                    });


                    /* SACAR EL CURSOR */

                    imagen.addEventListener("mouseleave", function() {

                        nombrePlanta.classList.remove("visible");

                    });


                    casilla.appendChild(imagen);

                }


                jardin.appendChild(casilla);

            }

        }

    </script>
