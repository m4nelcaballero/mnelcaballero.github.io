    <style>

        /* =====================================================
           CONFIGURACIÓN GENERAL
           ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: "Archivo", sans-serif;
            background: white;
            color: black;
            font-weight: 400;
        }


        /* =====================================================
           MENÚ
           ===================================================== */

        nav {
            position: fixed;
            top: 30px;
            left: 30px;
            width: 170px;

            text-align: center;

            z-index: 1000;
        }

        nav a {
            display: block;

            color: black;
            text-decoration: none;

            font-family: "Archivo", sans-serif;
            font-size: 16px;
            font-weight: 700;

            margin-bottom: 8px;

            cursor: pointer;
        }

        nav a:hover {
            text-decoration: underline;
        }


        /* =====================================================
           CONTENIDO GENERAL
           ===================================================== */

        main {
            width: 100%;
            height: 100vh;

            padding: 80px 20px 30px 230px;

            overflow: hidden;
        }


        /* =====================================================
           SECCIONES
           ===================================================== */

        .seccion {
            display: none;

            width: 100%;
            height: 100%;
        }

        .seccion.activa {
            display: block;
        }


        /* =====================================================
           DESCRIPCIÓN
           ===================================================== */

        #descripcion p {
            font-family: "Archivo", sans-serif;

            font-size: 16px;
            line-height: 1.5;

            max-width: 700px;

            font-weight: 400;
        }


        /* =====================================================
           GALERÍAS
           ===================================================== */

        .galeria {
            width: 100%;

            text-align: center;

            height: 100%;

            overflow: hidden;
        }

        .galeria img {
            display: block;

            width: auto;

            max-width: 650px;
            max-height: 80vh;

            height: auto;

            margin: 0 auto 15px auto;
        }


        /* =====================================================
           JARDÍN
           ===================================================== */

        #jardin {
            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;
        }


        /* =====================================================
           CONTENEDOR DEL JARDÍN
           ===================================================== */

        .jardin-contenedor {

            /*
               El tamaño se calcula automáticamente.

               El jardín nunca será más ancho que el espacio
               disponible y tampoco más alto que la pantalla.

               Dejamos espacio para:

               - menú lateral
               - nombre de la planta
               - márgenes
            */

            width: min(
                calc(100vw - 280px),
                calc(100vh - 150px)
            );

            aspect-ratio: 1 / 1;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: flex-start;

            flex-shrink: 1;

            overflow: visible;
        }


        /* =====================================================
           CUADRÍCULA 10 × 10
           ===================================================== */

        .jardin-grid {

            width: 100%;

            aspect-ratio: 1 / 1;

            display: grid;

            /*
               EXACTAMENTE:

               10 columnas
               10 filas

               = 100 casillas
            */

            grid-template-columns:
                repeat(10, 1fr);

            grid-template-rows:
                repeat(10, 1fr);

            position: relative;

            flex-shrink: 1;
        }


        /* =====================================================
           CASILLAS
           ===================================================== */

        .casilla-planta {

            width: 100%;
            height: 100%;

            position: relative;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;
        }


        /* =====================================================
           IMÁGENES
           ===================================================== */

        .casilla-planta img {

            /*
               La imagen ocupa la casilla.

               El navegador adapta automáticamente cualquier
               fotografía a un cuadrado.
            */

            display: block;

            width: 100%;
            height: 100%;

            /*
               COVER hace que todas las imágenes tengan
               exactamente el mismo tamaño cuadrado.

               Si una fotografía es horizontal o vertical,
               se recorta automáticamente.
            */

            object-fit: cover;

            /*
               Centro del recorte.
            */

            object-position: center center;

            cursor: pointer;

            /*
               Pequeña transición al pasar el cursor.
            */

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;

            /*
               Evita que la imagen pueda deformarse.
            */

            max-width: none;
            max-height: none;
        }


        /* =====================================================
           HOVER DE LAS IMÁGENES
           ===================================================== */

        .casilla-planta img:hover {

            opacity: 0.70;

            transform: scale(0.96);
        }


        /* =====================================================
           NOMBRE DE LA PLANTA
           ===================================================== */

        .nombre-planta {

            /*
               Reservamos espacio permanente.

               Así el jardín NO se mueve cuando aparece
               el nombre.
            */

            width: 100%;

            height: 28px;

            margin-top: 18px;

            text-align: center;

            font-family: "Archivo", sans-serif;

            font-size: 16px;

            font-weight: 400;

            line-height: 28px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            opacity: 0;

            transition: opacity 0.2s ease;
        }

        .nombre-planta.visible {
            opacity: 1;
        }


        /* =====================================================
           MÓVIL
           ===================================================== */

        @media (max-width: 600px) {

            nav {

                top: 20px;
                left: 15px;

                width: 140px;
            }

            nav a {

                font-size: 15px;

                margin-bottom: 6px;
            }

            main {

                padding:
                    120px
                    15px
                    15px
                    15px;
            }

            #jardin {

                width: 100%;
                height: 100%;
            }

            .jardin-contenedor {

                /*
                   En móvil utilizamos prácticamente
                   todo el ancho disponible.

                   También se limita por la altura.
                */

                width: min(
                    calc(100vw - 30px),
                    calc(100vh - 180px)
                );
            }

            .nombre-planta {

                font-size: 14px;

                margin-top: 12px;
            }

        }

    </style>

</head>

    <!-- =====================================================

    <script>


        /* =================================================
           CAMBIAR DE SECCIÓN
           ================================================= */

        function mostrarSeccion(seccion) {

            const secciones =
                document.querySelectorAll(".seccion");


            secciones.forEach(function(elemento) {

                elemento.classList.remove("activa");

            });


            document
                .getElementById(seccion)
                .classList.add("activa");


            /*
               Volvemos arriba.

               Como el body tiene overflow:hidden,
               no se genera scroll.
            */

            window.scrollTo(0, 0);

        }



        /* =================================================

           =================================================

           Solo se intentarán mostrar las imágenes
           que estén indicadas aquí.

        ================================================= */

            },

            },

            {

            },

            {

            },

            {

            },

            {
                imagen: "planta9.jpg",

                fila: 9,

            },

            {
                imagen: "planta7.jpg",

                fila: 10,

            },

            {
                imagen: "planta11.jpg",

            }

        ];



        /* =================================================
           CREAR EL JARDÍN
           ================================================= */

        const jardinGrid =
            document.getElementById("jardinGrid");


        const nombrePlanta =
            document.getElementById("nombrePlanta");


        /*
           =================================================
           CREAR LAS 100 CASILLAS
           =================================================

           10 filas × 10 columnas.

           Las casillas sin planta quedan vacías.
        */

        for (
            let fila = 1;
            fila <= 10;
            fila++
        ) {

            for (
                let columna = 1;
                columna <= 10;
                columna++
            ) {


                /* =========================================
                   CREAR CASILLA
                   ========================================= */

                const casilla =
                    document.createElement("div");


                casilla.classList.add(
                    "casilla-planta"
                );


                /* =========================================
                   BUSCAR PLANTA
                   ========================================= */

                const planta =
                    plantas.find(function(item) {

                        return (
                            item.fila === fila &&
                            item.columna === columna
                        );

                    });


                /*
                   =========================================
                   SI HAY UNA PLANTA
                   =========================================
                */

                if (planta) {


                    /*
                       CREAR IMAGEN
                    */

                    const imagen =
                        document.createElement("img");


                    /*
                       ASIGNAR ARCHIVO

                       El archivo debe estar en la misma
                       carpeta que este HTML.

                       Ejemplo:

                       index.html
                       planta1.jpg
                       planta2.jpg
                       planta3.jpg
                       ...
                    */

                    imagen.src =
                        planta.imagen;


                    /*
                       NOMBRE PARA ACCESIBILIDAD
                    */

                    imagen.alt =
                        planta.nombre;


                    /*
                       =====================================
                       HOVER: ENTRAR
                       =====================================
                    */

                    imagen.addEventListener(
                        "mouseenter",
                        function() {


                            /*
                               MOSTRAR NOMBRE
                            */

                            nombrePlanta.textContent =
                                planta.nombre;


                            nombrePlanta.classList.add(
                                "visible"
                            );

                        }
                    );


                    /*
                       =====================================
                       HOVER: SALIR
                       =====================================
                    */

                    imagen.addEventListener(
                        "mouseleave",
                        function() {


                            /*
                               OCULTAR NOMBRE
                            */

                            nombrePlanta.classList.remove(
                                "visible"
                            );

                        }
                    );


                    /*
                       =====================================
                       AÑADIR IMAGEN A CASILLA
                       =====================================
                    */

                    casilla.appendChild(
                        imagen
                    );

                }


                /*
                   =========================================
                   AÑADIR CASILLA A LA CUADRÍCULA
                   =========================================
                */

                jardinGrid.appendChild(
                    casilla
                );

            }

        }


    </script>
