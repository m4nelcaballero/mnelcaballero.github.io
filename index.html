<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- GOOGLE FONT: ARCHIVO -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">


    <style>

        /* =====================================================
           CONFIGURACIÓN GENERAL
           ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: "Archivo", sans-serif;
            background: white;
            color: black;
            font-weight: 400;
            overflow: hidden;
        }


        /* =====================================================
           MENÚ
           ===================================================== */

        nav {
            position: fixed;
            top: 30px;
            left: 30px;
            width: 170px;
            text-align: center;
            z-index: 1000;
        }

        nav a {
            display: block;
            color: black;
            text-decoration: none;
            font-family: "Archivo", sans-serif;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            cursor: pointer;
        }

        nav a:hover {
            text-decoration: underline;
        }


        /* =====================================================
           CONTENIDO
           ===================================================== */

        main {
            width: 100%;
            height: 100vh;

            padding: 80px 20px 30px 230px;

            margin: 0 auto;
        }


        /* =====================================================
           SECCIONES
           ===================================================== */

        .seccion {
            display: none;
        }

        .seccion.activa {
            display: block;
        }


        /* =====================================================
           DESCRIPCIÓN
           ===================================================== */

        #descripcion p {
            font-family: "Archivo", sans-serif;
            font-size: 16px;
            line-height: 1.5;
            max-width: 700px;
            font-weight: 400;
        }


        /* =====================================================
           GALERÍAS
           ===================================================== */

        .galeria {
            width: 100%;
            text-align: center;
        }

        .galeria img {
            display: block;
            width: auto;
            max-width: 650px;
            max-height: 80vh;
            height: auto;
            margin: 0 auto 15px auto;
        }


        /* =====================================================
           JARDÍN
           ===================================================== */

        #jardin {
            width: 100%;
            height: calc(100vh - 110px);

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;
        }


        /* =====================================================
           CONTENEDOR DEL JARDÍN
           ===================================================== */

        .jardin-contenedor {

            /*
               El jardín se adapta a la pantalla.

               No supera el 70% de la altura disponible
               para dejar espacio al nombre debajo.
            */

            width: min(
                calc(100vw - 270px),
                calc((100vh - 160px) * 0.90)
            );

            aspect-ratio: 1 / 1;

            display: flex;
            flex-direction: column;

            align-items: center;
        }


        /* =====================================================
           CUADRÍCULA 10 × 10
           ===================================================== */

        .jardin-grid {

            width: 100%;
            aspect-ratio: 1 / 1;

            display: grid;

            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);

            position: relative;
        }


        /* =====================================================
           CASILLAS
           ===================================================== */

        .casilla-planta {

            width: 100%;
            height: 100%;

            position: relative;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: visible;
        }


        /* =====================================================
           IMÁGENES
           ===================================================== */

        .casilla-planta img {

            display: block;

            /*
               Las imágenes son pequeñas.

               Al estar dentro de una cuadrícula 10×10,
               se verá todo el jardín de una vez.
            */

            width: 82%;
            height: 82%;

            object-fit: cover;

            cursor: pointer;

            position: relative;

            z-index: 1;

            transition:
                transform 0.25s ease,
                opacity 0.25s ease;
        }


        /* =====================================================
           HOVER
           ===================================================== */

        .casilla-planta img:hover {

            opacity: 0.65;

            z-index: 20;
        }


        /* =====================================================
           NOMBRE DE LA PLANTA
           ===================================================== */

        .nombre-planta {

            /*
               Reservamos siempre este espacio.

               Así la cuadrícula NO se mueve cuando aparece
               el nombre.
            */

            width: 100%;

            height: 28px;

            margin-top: 18px;

            text-align: center;

            font-family: "Archivo", sans-serif;

            font-size: 16px;

            font-weight: 400;

            line-height: 28px;

            opacity: 0;

            transition: opacity 0.2s ease;
        }


        .nombre-planta.visible {

            opacity: 1;

        }


        /* =====================================================
           MÓVIL
           ===================================================== */

        @media (max-width: 600px) {

            body {
                overflow: hidden;
            }


            nav {

                top: 20px;

                left: 15px;

                width: 140px;

            }


            nav a {

                font-size: 15px;

                margin-bottom: 6px;

            }


            main {

                padding:
                    120px
                    15px
                    20px
                    15px;

            }


            #jardin {

                height:
                    calc(100vh - 140px);

            }


            .jardin-contenedor {

                width:
                    min(
                        calc(100vw - 30px),
                        calc((100vh - 190px) * 0.90)
                    );

            }


            .casilla-planta img {

                width: 80%;

                height: 80%;

            }


            .nombre-planta {

                font-size: 14px;

                margin-top: 12px;

            }

        }

    </style>

</head>

    <!-- =====================================================

    <script>


        /* =================================================
           CAMBIAR DE SECCIÓN
           ================================================= */

        function mostrarSeccion(seccion) {

            const secciones =
                document.querySelectorAll(".seccion");


            secciones.forEach(function(elemento) {

                elemento.classList.remove("activa");

            });


            document
                .getElementById(seccion)
                .classList.add("activa");


            window.scrollTo(0, 0);

        }



        /* =================================================
           PLANTAS DEL JARDÍN
           =================================================

           MANTENEMOS EXACTAMENTE:

           - nombres de imágenes
           - nombres de plantas
           - filas
           - columnas

        ================================================= */


        const plantas = [

            {
                imagen: "planta1.jpg",
                nombre: "albahaca (Ocimum basilicum)",
                fila: 1,
                columna: 1
            },

            {
                imagen: "planta1.jpg",
                nombre: "albahaca (Ocimum basilicum)",
                fila: 1,
                columna: 2
            },

            {
                imagen: "planta2.jpg",
                nombre: "menta (Mentha)",
                fila: 2,
                columna: 1
            },

            {
                imagen: "planta2.jpg",
                nombre: "menta (Mentha)",
                fila: 2,
                columna: 2
            },

            {
                imagen: "planta3.jpg",
                nombre: "perejil (Petroselinum crispum)",
                fila: 3,
                columna: 1
            },

            {
                imagen: "planta4.jpg",
                nombre: "rosa mosqueta (Rosa sempervirens)",
                fila: 4,
                columna: 1
            },

            {
                imagen: "planta5.jpg",
                nombre: "jazmín blanco (Jasminium officinale)",
                fila: 5,
                columna: 1
            },

            {
                imagen: "planta6.jpg",
                nombre: "adelfa (Nerium oleander)",
                fila: 6,
                columna: 1
            },

            {
                imagen: "planta7.jpg",
                nombre: "aligustre (Ligustrum lucidum)",
                fila: 7,
                columna: 1
            },

            {
                imagen: "planta8.jpg",
                nombre: "cinta (Chlorophytum comosum)",
                fila: 8,
                columna: 2
            },

            {
                imagen: "planta9.jpg",
                nombre: "viburnum dulce (Viburnum odoratissium)",
                fila: 9,
                columna: 2
            },

            {
                imagen: "planta7.jpg",
                nombre: "aligustre (Ligustrum lucidum)",
                fila: 10,
                columna: 1
            },

            {
                imagen: "planta11.jpg",
                nombre: "esparraguera africana (Asparagus desinflorus)",
                fila: 10,
                columna: 2
            },

            {
                imagen: "planta12.jpg",
                nombre: "limonero (Citrus limon)",
                fila: 10,
                columna: 3
            },

            {
                imagen: "planta13.jpg",
                nombre: "azahar de la china (Pittosporum tobira)",
                fila: 9,
                columna: 4
            },

            {
                imagen: "planta6.jpg",
                nombre: "adelfa (Nerium oleander)",
                fila: 10,
                columna: 5
            },

            {
                imagen: "planta14.jpg",
                nombre: "tomillo (Thymus vulgaris)",
                fila: 10,
                columna: 6
            },

            {
                imagen: "planta15.jpg",
                nombre: "bonetero (Euonymus japonicus)",
                fila: 9,
                columna: 7
            },

            {
                imagen: "planta6.jpg",
                nombre: "adelfa (Nerium oleander)",
                fila: 9,
                columna: 9
            },

            {
                imagen: "planta16.jpg",
                nombre: "yuca pie de elefante (Yuca gigantea)",
                fila: 9,
                columna: 10
            },

            {
                imagen: "planta17.jpg",
                nombre: "geranio (Pelargonium hortorum)",
                fila: 1,

            },

            {

                fila: 2,
                columna: 4
            },

            {
                imagen: "planta23.jpg",
                nombre: "Nombre de la planta 23",
                fila: 9,
                columna: 5
            },

            {
                imagen: "planta24.jpg",
                nombre: "Nombre de la planta 24",
                fila: 9,
                columna: 8
            },

            {
                imagen: "planta25.jpg",
                nombre: "Nombre de la planta 25",
                fila: 10,
                columna: 2
            },

            {
                imagen: "planta26.jpg",
                nombre: "Nombre de la planta 26",
                fila: 10,
                columna: 3
            },

            {
                imagen: "planta27.jpg",
                nombre: "Nombre de la planta 27",
                fila: 10,
                columna: 8
            },

            {
                imagen: "planta28.jpg",
                nombre: "Nombre de la planta 28",
                fila: 10,
                columna: 9
            }

        ];



        /* =================================================
           CREAR JARDÍN
           ================================================= */

        const jardinGrid =
            document.getElementById("jardinGrid");


        const nombrePlanta =
            document.getElementById("nombrePlanta");


        /*
           Creamos exactamente 100 casillas:
           10 filas × 10 columnas.
        */

        for (
            let fila = 1;
            fila <= 10;
            fila++
        ) {

            for (
                let columna = 1;
                columna <= 10;
                columna++
            ) {


                /* CREAR CASILLA */

                const casilla =
                    document.createElement("div");


                casilla.classList.add(
                    "casilla-planta"
                );


                /*
                   BUSCAR PLANTA
                */

                const planta =
                    plantas.find(function(item) {

                        return (
                            item.fila === fila &&
                            item.columna === columna
                        );

                    });


                /*
                   SI EXISTE UNA PLANTA
                */

                if (planta) {


                    /* CREAR IMAGEN */

                    const imagen =
                        document.createElement("img");


                    imagen.src =
                        planta.imagen;


                    imagen.alt =
                        planta.nombre;


                    /*
                       =================================================
                       COMPOSICIÓN NATURAL
                       =================================================

                       Pequeños desplazamientos para evitar
                       que todas las fotografías parezcan
                       perfectamente alineadas.
                    */


                    const desplazamientoX =
                        (Math.random() * 10) - 5;


                    const desplazamientoY =
                        (Math.random() * 10) - 5;


                    const escala =
                        0.80 +
                        (Math.random() * 0.16);


                    const rotacion =
                        (Math.random() * 4) - 2;


                    /*
                       GUARDAR VALORES
                    */

                    imagen.dataset.x =
                        desplazamientoX;

                    imagen.dataset.y =
                        desplazamientoY;

                    imagen.dataset.escala =
                        escala;

                    imagen.dataset.rotacion =
                        rotacion;


                    /*
                       POSICIÓN INICIAL
                    */

                    imagen.style.transform =
                        `
                        translate(
                            ${desplazamientoX}px,
                            ${desplazamientoY}px
                        )
                        scale(${escala})
                        rotate(${rotacion}deg)
                        `;


                    /*
                       =================================================
                       ENTRAR CON EL CURSOR
                       =================================================
                    */

                    imagen.addEventListener(
                        "mouseenter",
                        function() {


                            /*
                               MOSTRAR NOMBRE
                            */

                            nombrePlanta.textContent =
                                planta.nombre;


                            nombrePlanta.classList.add(
                                "visible"
                            );


                            /*
                               AMPLIAR LIGERAMENTE
                            */

                            const escalaHover =
                                parseFloat(
                                    imagen.dataset.escala
                                ) + 0.10;


                            imagen.style.transform =
                                `
                                translate(
                                    ${imagen.dataset.x}px,
                                    ${imagen.dataset.y}px
                                )
                                scale(${escalaHover})
                                rotate(${imagen.dataset.rotacion}deg)
                                `;


                            imagen.style.zIndex =
                                "20";

                        }
                    );


                    /*
                       =================================================
                       SALIR CON EL CURSOR
                       =================================================
                    */

                    imagen.addEventListener(
                        "mouseleave",
                        function() {


                            /*
                               OCULTAR NOMBRE
                            */

                            nombrePlanta.classList.remove(
                                "visible"
                            );


                            /*
                               VOLVER A SU ESTADO
                            */

                            imagen.style.transform =
                                `
                                translate(
                                    ${imagen.dataset.x}px,
                                    ${imagen.dataset.y}px
                                )
                                scale(${imagen.dataset.escala})
                                rotate(${imagen.dataset.rotacion}deg)
                                `;


                            imagen.style.zIndex =
                                "1";

                        }
                    );


                    /*
                       AÑADIR IMAGEN
                    */

                    casilla.appendChild(
                        imagen
                    );

                }


                /*
                   AÑADIR CASILLA
                */

                jardinGrid.appendChild(
                    casilla
                );

            }

        }

    </script>
