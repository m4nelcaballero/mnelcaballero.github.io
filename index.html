<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: white;
            color: black;
        }


        /* MENÚ */

        nav {
            position: fixed;
            top: 30px;
            left: 30px;
            width: 170px;
            text-align: center;
            z-index: 1000;
        }

        nav a {
            display: block;
            color: black;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            cursor: pointer;
        }

        nav a:hover {
            text-decoration: underline;
        }


        /* CONTENIDO */

        main {
            padding: 80px 20px 40px 230px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .seccion {
            display: none;
        }

        .seccion.activa {
            display: block;
        }


        /* DESCRIPCIÓN */

        #descripcion p {
            font-size: 16px;
            line-height: 1.6;
            max-width: 700px;
        }


        /* GALERÍA */

        .galeria {
            width: 100%;
            text-align: center;
        }

        .galeria img {
            display: block;
            width: auto;
            max-width: 650px;
            max-height: 80vh;
            height: auto;
            margin: 0 auto 40px auto;
        }


        /* MÓVIL */

        @media (max-width: 600px) {

            nav {
                top: 20px;
                left: 15px;
                width: 140px;
            }

            nav a {
                font-size: 14px;
                margin-bottom: 8px;
            }

            main {
                padding: 130px 15px 30px 15px;
            }

            .galeria img {
                max-width: 100%;
                max-height: none;
                margin-bottom: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- MENÚ -->

    <nav>

        <a href="#" onclick="mostrarSeccion('descripcion')">
            descripción
        </a>

        <a href="#" onclick="mostrarSeccion('fotografias')">
            fotografias
        </a>

        <a href="#" onclick="mostrarSeccion('dibujoypintura')">
            dibujo y pintura
        </a>

    </nav>



    <main>


        <!-- DESCRIPCIÓN -->

        <section id="descripcion" class="seccion activa">

    <!-- FUNCIONAMIENTO DE LAS PESTAÑAS -->

    <script>

        function mostrarSeccion(seccion) {

            const secciones = document.querySelectorAll('.seccion');

            secciones.forEach(function(elemento) {
                elemento.classList.remove('activa');
            });

            document.getElementById(seccion).classList.add('activa');

            window.scrollTo(0, 0);

        }

    </script>


</body>

</html>
